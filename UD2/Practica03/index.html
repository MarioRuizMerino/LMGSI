<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Mario Ruiz Merino">
    <link rel="stylesheet" href="index.css">
    <title>Pixel Zone - Nueva reserva</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1>PIXEL ZONE</h1>
        </div>
    </header>
    <main>
        <div class="formulario">
            <form action="/procesarreserva.php" method="post">
                <fieldset>
                    <legend>Nueva reserva</legend>
                    <div>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos" required>
                    </div>
                    <div>
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div>
                        <label for="plataforma">Plataforma:</label>
                        <input type="text" id="plataforma" name="plataforma" placeholder="Escribe o selecciona un producto" required>
                    </div>

                    <div>
                        <label for="producto">Producto:</label>
                        <input list="productos" id="producto" name="producto" required>
                        <datalist id="productos" >
                            <option value="fc27">EA Sports FC 27</option>
                            <option value="minecraft">Minecraft</option>
                            <option value="mariokart">Mario Kart</option>
                            <option value="gtav">Grand Theft Auto 5</option>
                            <option value="zelda">The Legend of Zelda</option>
                        </datalist>
                    </div>

                    <div>
                        <label>Edición:</label> <br>
                        <div class="radio">
                            <div>
                                <input type="radio" id="estandar" name="edicion" required> <br>
                                <label for="estandar">Estándar</label>
                            </div>
                            <div>
                                <input type="radio" id="deluxe" name="edicion" required> <br>
                                <label for="deluxe">Deluxe</label>
                            </div>
                            <div>
                                <input type="radio" id="coleccionista" name="edicion" required> <br>
                                <label for="coleccionista">Coleccionista</label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" name="cantidad" placeholder="1" required>
                    </div>

                    <div>
                        <label for="fecha">Fecha de recogida:</label>
                        <input type="date" id="fecha" name="fecha" placeholder="Nombre y apellidos" required>
                    </div>

                    <div>
                        <label for="presupuesto">Presupuesto máximo:</label>
                        <input type="range" id="presupuesto" name="presupuesto" value="0" max="1000"
                               oninput="this.nextElementSibling.value = this.value" required>
                        <output for="presupuesto">0</output>
                    </div>

                    <div class="observacion">
                        <label for="observaciones">Observaciones:</label>
                        <textarea id="observaciones" cols="30" rows="20" style="field-sizing: content"
                                  placeholder="Indica aquí cualquier observación sobre la reserva"></textarea>
                    </div>

                    <div class="imagen">
                        <label for="imagen">Imagen del producto</label>
                        <input type="file" id="imagen" name="imagen">
                    </div>
                    <div>
                        <input type="checkbox" required>
                        <p>Acepto las condiciones de reserva</p>
                    </div>

                    <div class="botones">
                        <button type="submit">Enviar reserva</button>
                        <button type="reset">Restablecer</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </main>
    <footer>
        <div>
            <h3>Siguenos en redes</h3>
        </div>
        <div>
            <a href="https://facebook.com"><img src="imagenes/icons8-facebook-48.png" alt="Facebook"></a>
            <a href="https://instagram.com"><img src="imagenes/icons8-instagram-48.png" alt="Instagram"></a>
            <a href="https://x.com"><img src="imagenes/icons8-twitter-48.png" alt="Twitter"></a>
            <a href="https://youtube.com"><img src="imagenes/icons8-youtube-48.png" alt="Youtube"></a>
        </div>
    </footer>
</body>
</html>
